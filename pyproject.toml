[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jig-agents"
version = "0.3.0"
description = "Jig: a model-independent command language for invoking, constraining and evaluating AI agents"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jig = "jig.cli:main"

[tool.setuptools.packages.find]
include = ["jig*"]

[tool.setuptools.package-data]
jig = ["registry/*.yaml", "schemas/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: invokes the real Claude Code CLI (costs money); run with -m live"]
addopts = "-m 'not live'"

# Lattice command registry.
# Every command is executed by the same runtime (lattice/runtime.py). A command
# is *data*: parameters, required context, output schema, tool policy and
# validators. There are no per-command agent implementations.
#
# Field reference
#   category      one of the 8 vocabulary categories
#   purpose       one-line description
#   maturity      core      - implemented + tested end to end, command-specific prompt/schema/validators
#                 generic   - runs on the shared agent path with a shared schema; not individually benchmarked
#                 native    - implemented by the runtime without an agent
#                 unavailable - defined, but requires an integration that is not configured; returns E_UNAVAILABLE
#   target        the positional argument
#                   artifact  : must name an existing artifact (or a script variable bound to one)
#                   text      : free text
#                   artifact_or_text : either; if it names an artifact, the artifact's stages become context
#   parameters    name -> {type, default, enum?, items?, description}
#                 types: string | integer | number | boolean | list | object | path | profile
#   artifact      create | use | optional | none
#   requires      stages of the artifact that must exist (and not be failed) before running
#   output_schema schema file in lattice/schemas/ (without .json)
#   execution     mode: agent | procedure | native ; tool_policy: see lattice.yaml
#   validators    semantic validator names (lattice/validators.py), run after JSON-schema validation
#   idempotent    true => safe to retry automatically on schema/validation failure
#   controls      approval_required: approval must exist before execution
#   errors        error codes this command can return (see docs/errors.md)
version: "0.1.0"

common_errors: &common_errors [E_PARAM, E_UNKNOWN_ARTIFACT, E_AGENT_UNAVAILABLE, E_AGENT_FAILED, E_SCHEMA, E_VALIDATION, E_TIMEOUT, E_BUDGET]

commands:
  # ───────────────────────────── Definition ─────────────────────────────
  requirement:
    category: definition
    purpose: Turn a goal into a structured, traceable requirement set with assumptions and open decisions.
    maturity: core
    target: {type: text, required: true, description: Natural-language goal}
    parameters:
      stack: {type: list, items: string, default: [], description: Technology components; matched to a stack profile}
      standard: {type: profile, default: null, description: "Quality/security profile, optionally pinned: enterprise@1.0.0"}
      brief: {type: path, default: null, description: Optional file with additional requirements (treated as untrusted data)}
      overrides: {type: object, default: {}, description: "Dotted-key overrides of the resolved profile, e.g. {'security.audit_logging': false}"}
      id: {type: string, default: null, description: Explicit artifact id (e.g. CRM-001)}
    artifact: create
    requires: []
    output_schema: requirement
    execution: {mode: agent, tool_policy: none}
    validators: [unique_ids, acceptance_criteria_reference_requirements, profile_controls_reflected, stack_reflected]
    idempotent: true
    controls: {approval_required: false}
    errors: [*common_errors, E_PROFILE]

  scope:
    category: definition
    purpose: Partition requirements into in-scope, deferred and excluded items with rationale.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      focus: {type: string, default: null}
    artifact: optional
    requires: []
    output_schema: generic_analysis
    execution: {mode: agent, tool_policy: none}
    validators: [unique_ids]
    idempotent: true
    controls: {approval_required: false}
    errors: *common_errors

  specify:
    category: definition
    purpose: Produce a detailed specification for one requirement or component.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      item: {type: string, default: null, description: Requirement or component id to specify}
    artifact: optional
    requires: []
    output_schema: generic_analysis
    execution: {mode: agent, tool_policy: none}
    validators: [unique_ids]
    idempotent: true
    controls: {approval_required: false}
    errors: *common_errors

  constrain:
    category: definition
    purpose: Record explicit constraints (technical, regulatory, budget) against an artifact.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      constraints: {type: list, items: string, default: []}
    artifact: optional
    requires: []
    output_schema: generic_analysis
    execution: {mode: agent, tool_policy: none}
    validators: [unique_ids]
    idempotent: true
    controls: {approval_required: false}
    errors: *common_errors

  # ──────────────────────────── Investigation ───────────────────────────
  research:
    category: investigation
    purpose: Research a topic on the web; every finding must cite a source the agent actually retrieved.
    maturity: core
    target: {type: artifact_or_text, required: true}
    parameters:
      question: {type: string, default: null, description: Specific question to answer about the topic}
      min_sources: {type: integer, default: 3, description: Minimum number of distinct sources}
    artifact: optional
    requires: []
    output_schema: research
    execution: {mode: agent, tool_policy: research}
    validators: [unique_ids, research_findings_sourced, research_min_sources, research_sources_retrieved]
    idempotent: true
    controls: {approval_required: false}
    errors: *common_errors

  analyze:
    category: investigation
    purpose: Analyze an artifact or its workspace and report structure, issues and observations.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      aspect: {type: string, default: null}
    artifact: optional
    requires: []
    output_schema: generic_analysis
    execution: {mode: agent, tool_policy: read_workspace}
    validators: [unique_ids]
    idempotent: true
    controls: {approval_required: false}
    errors: *common_errors

  compare:
    category: investigation
    purpose: Compare options against explicit criteria.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      options: {type: list, items: string, default: []}
      criteria: {type: list, items: string, default: []}
      decision_model: {type: string, default: trade_off_analysis}
    artifact: optional
    requires: []
    output_schema: decision
    execution: {mode: agent, tool_policy: none}
    validators: [decision_model_complete]
    idempotent: true
    controls: {approval_required: false}
    errors: [*common_errors, E_DECISION_MODEL]

  extract:
    category: investigation
    purpose: Extract structured items (entities, rules, requirements) from a document.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      source: {type: path, default: null, description: File to extract from (untrusted data)}
      kind: {type: string, default: items}
    artifact: optional
    requires: []
    output_schema: generic_analysis
    execution: {mode: agent, tool_policy: none}
    validators: [unique_ids]
    idempotent: true
    controls: {approval_required: false}
    errors: *common_errors

  # ────────────────────────────── Decision ──────────────────────────────
  decide:
    category: decision
    purpose: Make a decision between options using a registered decision model.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      options: {type: list, items: string, default: []}
      decision_model: {type: string, default: trade_off_analysis}
    artifact: optional
    requires: []
    output_schema: decision
    execution: {mode: agent, tool_policy: none}
    validators: [decision_model_complete]
    idempotent: true
    controls: {approval_required: false}
    errors: [*common_errors, E_DECISION_MODEL]

  evaluate:
    category: decision
    purpose: Score an artifact or proposal against a decision model's criteria.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      decision_model: {type: string, default: risk_assessment}
      options: {type: list, items: string, default: []}
    artifact: optional
    requires: []
    output_schema: decision
    execution: {mode: agent, tool_policy: read_workspace}
    validators: [decision_model_complete]
    idempotent: true
    controls: {approval_required: false}
    errors: [*common_errors, E_DECISION_MODEL]

  challenge:
    category: decision
    purpose: Argue against a stated decision or design to surface weaknesses and unexamined assumptions.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      claim: {type: string, default: null}
    artifact: optional
    requires: []
    output_schema: generic_analysis
    execution: {mode: agent, tool_policy: read_workspace}
    validators: [unique_ids]
    idempotent: true
    controls: {approval_required: false}
    errors: *common_errors

  justify:
    category: decision
    purpose: Produce an evidence-backed justification for a decision already taken.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      decision: {type: string, default: null}
      decision_model: {type: string, default: evidence_verification}
    artifact: optional
    requires: []
    output_schema: generic_analysis
    execution: {mode: agent, tool_policy: read_workspace}
    validators: [unique_ids]
    idempotent: true
    controls: {approval_required: false}
    errors: [*common_errors, E_DECISION_MODEL]

  # ─────────────────────────────── Design ───────────────────────────────
  design:
    category: design
    purpose: Produce a buildable design traced to every requirement, resolving open decisions.
    maturity: core
    target: {type: artifact, required: true}
    parameters:
      decision_model: {type: string, default: null, description: Optional decision model applied to open decisions}
      notes: {type: string, default: null}
    artifact: use
    requires: [requirement]
    output_schema: design
    execution: {mode: agent, tool_policy: none}
    validators: [unique_ids, design_traces_all_requirements, design_resolves_open_decisions, design_layout_matches_stack_contract, design_endpoints_reference_requirements]
    idempotent: true
    controls: {approval_required: false}
    errors: [*common_errors, E_MISSING_CONTEXT, E_DECISION_MODEL]

  architect:
    category: design
    purpose: Select and describe a system architecture using the architecture_selection model.
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      decision_model: {type: string, default: architecture_selection}
      options: {type: list, items: string, default: []}
    artifact: optional
    requires: []
    output_schema: decision
    execution: {mode: agent, tool_policy: none}
    validators: [decision_model_complete]
    idempotent: true
    controls: {approval_required: false}
    errors: [*common_errors, E_DECISION_MODEL]

  model:
    category: design
    purpose: Produce a domain/data model (entities, relationships, invariants).
    maturity: generic
    target: {type: artifact_or_text, required: true}
    parameters:
      kind: {type: string, default: domain, enum: [domain, data, state, threat]}
    artifact: optional
    requires: []
    output_schema: generic_analysis
    execution: {mode: agent, tool_policy: none}
    validators: [unique_ids]
    idempotent: true
    controls: {approval_required: false}
    errors: *common_errors

  prototype:
    category: design
    purpose: Build a throwaway prototype in an isolated prototype workspace.
    maturity: generic
    target: {type: artifact, required: true}
    parameters:
      focus: {type: string, default: null}
    artifact: use
    requires: [requirement]
    output_schema: build
    execution: {mode: agent, tool_policy: build, workspace: prototype}
    validators: [claimed_files_exist, no_secrets_in_workspace]
    idempotent: false
    controls: {approval_required: false}
    errors: [*common_errors, E_MISSING_CONTEXT]

  # ────────────────────────────── Execution ─────────────────────────────
  build:
    category: execution
    purpose: Implement the design in the artifact workspace, following the stack contract.
    maturity: core
    target: {type: artifact, required: true}
    parameters:
      path: {type: string, default: null, description: Workspace directory (default from lattice.yaml workspace_root/<artifact_id>)}
      notes: {type: string, default: null}
    artifact: use
    requires: [requirement, design]
    output_schema: build
    execution: {mode: agent, tool_policy: build}
    validators: [stack_contract_files_exist, compose_services_present, migrations_present, claimed_files_exist, no_secrets_in_workspace]
    idempotent: false
    controls: {approval_required: false}
    errors: [*common_errors, E_MISSING_CONTEXT]

  implement:
    category: execution
    purpose: Implement one specific change or requirement in an existing workspace.
    maturity: generic
    target: {type: artifact, required: true}
    parameters:
      item: {type: string, default: null, description: Requirement id or change description}
    artifact: use
    requires: [requirement]
    output_schema: build
    execution: {mode: agent, tool_policy: build}
    validators: [claimed_files_exist, no_secrets_in_workspace]
    idempotent: false
    controls: {approval_required: false}
    errors: [*common_errors, E_MISSING_CONTEXT]

  refactor:
    category: execution
    purpose: Restructure workspace code without changing behaviour.
    maturity: generic
    target: {type: artifact, required: true}
    parameters:
      goal: {type: string, default: null}
    artifact: use
    requires: [build]
    output_schema: build
    execution: {mode: agent, tool_policy: build}
    validators: [claimed_files_exist, no_secrets_in_workspace]
    idempotent: false
    controls: {approval_required: false}
    errors: [*common_errors, E_MISSING_CONTEXT]

  integrate:
    category: execution
    purpose: Integrate the workspace with an external system described by the caller.
    maturity: generic
    target: {type: artifact, required: true}
    parameters:
      system: {type: string, default: null}
    artifact: use
    requires: [build]
    output_schema: build
    execution: {mode: agent, tool_policy: build}
    validators: [claimed_files_exist, no_secrets_in_workspace]
    idempotent: false
    controls: {approval_required: false}
    errors: [*common_errors, E_MISSING_CONTEXT]

  # ─────────────────────────────── Quality ──────────────────────────────
  review:
    category: quality
    purpose: Review the workspace against named criteria; findings must cite real files.
    maturity: core
    target: {type: artifact, required: true}
    parameters:
      criteria: {type: list, items: string, default: [security, architecture, maintainability]}
    artifact: use
    requires: [build]
    output_schema: review
    execution: {mode: agent, tool_policy: read_workspace}
    validators: [all_criteria_assessed, findings_cite_existing_files]
    idempotent: true
    controls: {approval_required: false}
    errors: [*common_errors, E_MISSING_CONTEXT]

  test:
    category: quality
    purpose: Run the stack profile's test suites and parse real results (JUnit XML, HTTP checks).
    maturity: core
    target: {type: artifact, required: true}
    parameters:
      suites: {type: list, items: string, default: [], description: Subset of suite names (default all)}
      diagnose: {type: boolean, default: false, description: Ask the agent to diagnose failures (read-only)}
    artifact: use
    requires: [build]
    output_schema: test
    execution: {mode: procedure, procedure: run_test_suites, tool_policy: read_workspace}
    validators: [tests_executed]
    idempotent: true
    controls: {approval_required: false}
    errors: [E_PARAM, E_UNKNOWN_ARTIFACT, E_MISSING_CONTEXT, E_PROCEDURE, E_TIMEOUT, E_UNAVAILABLE]

  verify:
    category: quality
    purpose: Verify the workspace against requirements with file/symbol evidence and test results.
    maturity: core
    target: {type: artifact, required: true}
    parameters:
      against: {type: string, default: requirements, enum: [requirements, design]}
    artifact: use
    requires: [requirement, build]
    output_schema: verify
    execution: {mode: agent, tool_policy: read_workspace}
    validators: [verify_covers_all_items, evidence_files_exist, evidence_symbols_exist, test_evidence_matches_results]
    idempotent: true
    controls: {approval_required: false}
    errors: [*common_errors, E_MISSING_CONTEXT]

  validate:
    category: quality
    purpose: Check an artifact stage against its schema and validators without invoking the agent.
    maturity: native
    target: {type: artifact, required: true}
    parameters:
      stage: {type: string, default: null, description: Stage to re-validate (default all)}
    artifact: use
    requires: []
    output_schema: control
    execution: {mode: native, procedure: revalidate}
    validators: []
    idempotent: true
    controls: {approval_required: false}
    errors: [E_PARAM, E_UNKNOWN_ARTIFACT]

  # ────────────────────────────── Delivery ──────────────────────────────
  document:
    category: delivery
    purpose: Write or update developer documentation in the workspace.
    maturity: generic
    target: {type: artifact, required: true}
    parameters:
      audience: {type: string, default: developers}
    artifact: use
    requires: [build]
    output_schema: build
    execution: {mode: agent, tool_policy: docs}
    validators: [claimed_files_exist]
    idempotent: false
    controls: {approval_required: false}
    errors: [*common_errors, E_MISSING_CONTEXT]

  report:
    category: delivery
    purpose: Render a Markdown report of every stage of an artifact (no agent).
    maturity: native
    target: {type: artifact, required: true}
    parameters: {}
    artifact: use
    requires: []
    output_schema: control
    execution: {mode: native, procedure: report}
    validators: []
    idempotent: true
    controls: {approval_required: false}
    errors: [E_PARAM, E_UNKNOWN_ARTIFACT]

  package:
    category: delivery
    purpose: Create a zip of the workspace, excluding build outputs and dependencies.
    maturity: native
    target: {type: artifact, required: true}
    parameters: {}
    artifact: use
    requires: [build]
    output_schema: control
    execution: {mode: native, procedure: package}
    validators: []
    idempotent: true
    controls: {approval_required: false}
    errors: [E_PARAM, E_UNKNOWN_ARTIFACT, E_MISSING_CONTEXT]

  deploy:
    category: delivery
    purpose: Deploy to an environment. Requires approval; no deployment integration ships with v0.1.
    maturity: unavailable
    target: {type: artifact, required: true}
    parameters:
      environment: {type: string, default: production, enum: [local, staging, production]}
    artifact: use
    requires: [build, test]
    output_schema: control
    execution: {mode: native, procedure: deploy}
    validators: []
    idempotent: false
    controls: {approval_required: true}
    errors: [E_PARAM, E_UNKNOWN_ARTIFACT, E_MISSING_CONTEXT, E_APPROVAL_REQUIRED, E_UNAVAILABLE]

  # ─────────────────────────────── Control ──────────────────────────────
  approve:
    category: control
    purpose: Record a human approval for a gated command. Requires an interactive confirmation.
    maturity: native
    target: {type: artifact, required: true}
    parameters:
      command: {type: string, default: null, description: Command being approved (e.g. deploy)}
      note: {type: string, default: null}
    artifact: use
    requires: []
    output_schema: control
    execution: {mode: native, procedure: approve}
    validators: []
    idempotent: true
    controls: {approval_required: false}
    errors: [E_PARAM, E_UNKNOWN_ARTIFACT, E_APPROVAL_REQUIRED]

  checkpoint:
    category: control
    purpose: Snapshot an artifact's records and workspace (excluding dependencies) under a label.
    maturity: native
    target: {type: artifact, required: true}
    parameters:
      label: {type: string, default: null}
    artifact: use
    requires: []
    output_schema: control
    execution: {mode: native, procedure: checkpoint}
    validators: []
    idempotent: true
    controls: {approval_required: false}
    errors: [E_PARAM, E_UNKNOWN_ARTIFACT]

  rollback:
    category: control
    purpose: Restore an artifact to a checkpoint. Destructive; requires approval.
    maturity: native
    target: {type: artifact, required: true}
    parameters:
      to: {type: string, default: null, description: Checkpoint label}
    artifact: use
    requires: []
    output_schema: control
    execution: {mode: native, procedure: rollback}
    validators: []
    idempotent: false
    controls: {approval_required: true}
    errors: [E_PARAM, E_UNKNOWN_ARTIFACT, E_APPROVAL_REQUIRED]

  status:
    category: control
    purpose: Report the stages, statuses and last runs of an artifact (or all artifacts).
    maturity: native
    target: {type: artifact_or_text, required: false}
    parameters: {}
    artifact: optional
    requires: []
    output_schema: control
    execution: {mode: native, procedure: status}
    validators: []
    idempotent: true
    controls: {approval_required: false}
    errors: [E_UNKNOWN_ARTIFACT]

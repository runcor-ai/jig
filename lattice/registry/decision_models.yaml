# Decision model registry. A model is selected only when a command explicitly
# names it (decision_model=...). The runtime injects the model into the prompt
# and the `decision_model_complete` validator checks the output against it.
version: "0.1.0"

models:
  architecture_selection:
    version: "1.0.0"
    purpose: Choose a system architecture for stated requirements.
    inputs: [requirements, constraints, quality_attributes, candidate_architectures]
    criteria: [requirement_fit, operational_complexity, scalability, security_posture, team_familiarity, reversibility]
    assumptions_required: true
    outputs: [options, criteria_scores, recommendation, risks, assumptions]
    rules:
      - Score every option against every criterion (1-5) with a rationale.
      - State which requirements drive the recommendation.
      - Prefer the simplest option that satisfies all must-have requirements.

  technology_selection:
    version: "1.0.0"
    purpose: Choose a library, framework or service.
    inputs: [requirement, constraints, candidates]
    criteria: [capability_fit, maturity, ecosystem, licensing, operational_cost, lock_in]
    assumptions_required: true
    outputs: [options, criteria_scores, recommendation, risks, assumptions]
    rules:
      - Score every option against every criterion (1-5) with a rationale.
      - Flag licensing or lock-in concerns explicitly.

  risk_assessment:
    version: "1.0.0"
    purpose: Identify and rate risks for a plan or artifact.
    inputs: [subject, context]
    criteria: [likelihood, impact, detectability, mitigation_cost]
    assumptions_required: true
    outputs: [options, criteria_scores, recommendation, risks, assumptions]
    rules:
      - Treat each identified risk as an option and score it against every criterion.
      - Every high-impact risk needs a mitigation.

  trade_off_analysis:
    version: "1.0.0"
    purpose: Make explicit what is gained and lost between alternatives.
    inputs: [alternatives, priorities]
    criteria: [benefit, cost, risk, reversibility]
    assumptions_required: true
    outputs: [options, criteria_scores, recommendation, risks, assumptions]
    rules:
      - Score every option against every criterion (1-5) with a rationale.
      - Name what the recommendation gives up.

  root_cause_analysis:
    version: "1.0.0"
    purpose: Find the cause of a failure from evidence.
    inputs: [symptom, evidence]
    criteria: [evidence_strength, explains_all_symptoms, testability]
    assumptions_required: true
    outputs: [options, criteria_scores, recommendation, risks, assumptions]
    rules:
      - Treat each candidate cause as an option.
      - Distinguish observed evidence from inference.

  evidence_verification:
    version: "1.0.0"
    purpose: Decide whether a claim is supported by evidence.
    inputs: [claim, evidence]
    criteria: [source_reliability, directness, corroboration, recency]
    assumptions_required: true
    outputs: [options, criteria_scores, recommendation, risks, assumptions]
    rules:
      - Options are "supported", "partially supported", "unsupported".
      - Cite the specific evidence for each score.

  reversibility_assessment:
    version: "1.0.0"
    purpose: Classify how costly a decision is to reverse.
    inputs: [decision, context]
    criteria: [reversal_cost, reversal_time, data_migration_needed, external_commitments]
    assumptions_required: true
    outputs: [options, criteria_scores, recommendation, risks, assumptions]
    rules:
      - Options are "two-way door" and "one-way door"; score both.

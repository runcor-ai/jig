<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Segoe UI, system-ui, sans-serif" font-size="16">
  <rect width="1000" height="430" fill="#fcfcfb"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <!-- Jig side -->
  <rect x="20" y="20" width="440" height="390" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="40" y="52" font-size="20" font-weight="600" fill="#0b0b0b">Jig: the level of description</text>
  <text x="40" y="76" fill="#52514e">one way of working = one script + its step contracts</text>
  <g fill="#fcfcfb" stroke="#c3c2b7">
    <rect x="40" y="96" width="400" height="40" rx="8"/><rect x="40" y="146" width="400" height="40" rx="8"/>
    <rect x="40" y="196" width="400" height="40" rx="8"/><rect x="40" y="246" width="400" height="40" rx="8"/>
    <rect x="40" y="296" width="400" height="40" rx="8"/>
  </g>
  <g fill="#0b0b0b">
    <text x="56" y="122"><tspan font-weight="600">specify</tspan>  spec as prose or FACTS (Opus)</text>
    <text x="56" y="172"><tspan font-weight="600">build</tspan>  the code, by Opus or Luna</text>
    <text x="56" y="222"><tspan font-weight="600">test</tspan>  the real tests run (no AI)       <tspan fill="#52514e">switch</tspan></text>
    <text x="56" y="272"><tspan font-weight="600">verify</tspan>  every requirement (Opus)        <tspan fill="#52514e">switch</tspan></text>
    <text x="56" y="322"><tspan font-weight="600">fix rounds</tspan>  up to 2, fed by the checks    <tspan fill="#52514e">switch</tspan></text>
  </g>
  <text x="40" y="370" fill="#52514e">every answer checked by code; every step recorded</text>
  <text x="40" y="394" fill="#52514e">a built game, with its rules in src/logic.ts</text>
  <!-- arrow -->
  <line x1="468" y1="215" x2="532" y2="215" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <!-- Reality Engine side -->
  <rect x="540" y="20" width="440" height="390" rx="12" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.5"/>
  <text x="560" y="52" font-size="20" font-weight="600" fill="#0b0b0b">The Reality Engine: the measurement</text>
  <text x="560" y="76" fill="#52514e">rules locked before the first build</text>
  <g fill="#fcfcfb" stroke="#c3c2b7">
    <rect x="560" y="96" width="400" height="40" rx="8"/><rect x="560" y="146" width="400" height="40" rx="8"/>
    <rect x="560" y="196" width="400" height="40" rx="8"/><rect x="560" y="246" width="400" height="40" rx="8"/>
    <rect x="560" y="296" width="400" height="40" rx="8"/>
  </g>
  <g fill="#0b0b0b">
    <text x="576" y="122"><tspan font-weight="600">Compare</tspan>  4 ways of working, 6 hard briefs</text>
    <text x="576" y="172"><tspan font-weight="600">Take apart</tspan>  16 versions of the script</text>
    <text x="576" y="222"><tspan font-weight="600">Build out</tspan>  designer's new parts, screened</text>
    <text x="576" y="272"><tspan font-weight="600">Confirm</tspan>  6 sealed briefs, opened once</text>
    <text x="576" y="322"><tspan font-weight="600">Report</tspan>  the trust score and verdict</text>
  </g>
  <text x="560" y="370" fill="#52514e">scored by hidden acceptance tests, copied in only</text>
  <text x="560" y="394" fill="#52514e">after the build; ranges over briefs</text>
</svg>
